<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seafood Product Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a5c8f;--gold:#e8f4fb;--gold-d:#0d84bd;--ink:#1d2733;--mut:#68727f;--bg:#f4f8fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.hero{background:radial-gradient(120% 140% at 50% 0%,#14a0dc 0%,var(--navy) 58%,#073d5e 100%);color:#fff;padding:26px 20px 24px;text-align:center}
.hero .kicker{letter-spacing:.35em;font-size:12px;color:var(--gold);text-transform:uppercase;margin-bottom:18px}
.brand{display:inline-block;background:#fff;border-radius:14px;padding:8px 20px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.brand img{height:38px;display:block}
.hero h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(34px,7vw,54px);font-weight:700;line-height:1.15}
.hero h1 em{color:var(--gold);font-style:normal}
.hero .search{margin-top:0}
.search{max-width:560px;margin:0 auto;position:relative}
.search input{width:100%;font-size:17px;padding:13px 20px 13px 50px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;outline:none}
.search input::placeholder{color:#8fa0b3}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);opacity:.6}
.bar{position:sticky;top:0;z-index:20;background:rgba(244,248,251,.92);backdrop-filter:blur(12px);border-bottom:1px solid #dbe7ee}
.pills{display:flex;gap:10px;overflow-x:auto;padding:14px 18px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;font-size:15px;font-weight:500;padding:10px 22px;border-radius:999px;border:1px solid #cfdfe9;background:#fff;color:var(--ink);cursor:pointer;transition:.2s}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.flip{display:none;justify-content:center;gap:10px;padding:16px 26px 0}
.flip.show{display:flex}
.wrap{max-width:1200px;margin:0 auto;padding:26px 18px 10px}
.count{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:6px 4px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:20px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.card{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px rgba(10,92,143,.08);transition:transform .25s,box-shadow .25s;border:1px solid #e3edf3;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(10,92,143,.16)}
.imgwrap{aspect-ratio:1;overflow:hidden;background:#fff}
.imgwrap img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s}
.card:hover .imgwrap img{transform:scale(1.04)}
.cbody{padding:16px 16px 20px;display:flex;flex-direction:column;flex:1}
.ccat{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);font-weight:600;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody h3{font-size:20px;font-weight:700;line-height:1.35}
.spec{font-size:15px;color:var(--ink);margin-top:8px;line-height:1.55}
.code{font-size:12.5px;color:#a09a8b;margin-top:auto;padding-top:10px;letter-spacing:.1em}
.card.hide{display:none}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:17px;display:none}
footer{text-align:center;padding:44px 20px;color:#a09a8b;font-size:13.5px;letter-spacing:.06em}
footer .rule{width:56px;height:2px;background:var(--gold-d);margin:0 auto 16px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.scrim{position:absolute;inset:0;background:rgba(6,13,24,.6);backdrop-filter:blur(3px)}
.sheet{position:relative;background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;animation:up .3s ease}
@media(min-width:700px){.modal{align-items:center;padding:24px}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet img{width:100%;max-height:46vh;object-fit:contain;display:block;background:#fff}
.sheet .pad{padding:26px 26px 34px}
.sheet .ccat{font-size:12px}
.sheet h2{font-family:"Playfair Display",Georgia,serif;font-size:30px;margin:8px 0 2px;line-height:1.25}
.sheet .spec{margin-top:12px;font-size:16.5px;line-height:1.7;background:var(--bg);border-radius:12px;padding:14px 16px}
.sheet .code{font-size:13px;color:#a09a8b;letter-spacing:.1em;margin-top:12px}
.close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(10,26,47,.55);color:#fff;font-size:20px;cursor:pointer}
</style></head><body>
<section class="hero">
  <div class="brand"><img src="images/logo.png" alt="Hai Sia Seafood"></div>
  <div class="kicker">Product Catalog</div>
  <div class="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" placeholder="Search code or product name...">
  </div>
</section>
<div class="bar"><div class="pills" id="pills"></div></div>
<div class="wrap">
  <div class="count" id="count"></div>
  <div class="grid">
</div>
  <div class="empty" id="empty">No products match — try another keyword.</div>
</div>
<footer><div class="rule"></div></footer>
<div class="modal" id="modal"><div class="scrim"></div>
  <div class="sheet">
    <button class="close" id="close">✕</button>
    <img id="mimg" alt="">
    <div class="flip" id="flip"><button class="pill on" id="bfront">Front</button><button class="pill" id="bback">Back</button></div>
    <div class="pad"><div class="ccat" id="mcat"></div><h2 id="mname"></h2><div class="spec" id="mspec"></div><div class="code" id="mcode"></div></div>
  </div>
</div>
<script>
// 产品资料在 products.json（Muse 维护）。这个文件只管网页的样子和功能。
const q=document.getElementById('q'),grid=document.querySelector('.grid'),pills=document.getElementById('pills'),
count=document.getElementById('count'),empty=document.getElementById('empty');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let f='All',cards=[];
// 搜索同时认带标点和不带标点的写法
const searchText=p=>{const t=`${p.code} ${p.name} ${p.packing} ${p.keywords||''}`.toLowerCase().trim();return t+' '+t.replace(/[,()]/g,'')};
function go(){let v=0;const s=q.value.trim().toLowerCase();
cards.forEach(c=>{const ok=(f==='All'||c.dataset.cat===f)&&(!s||c.dataset.search.includes(s));
c.classList.toggle('hide',!ok);if(ok)v++});
count.textContent=v?v+' of '+cards.length+' products':'';
empty.style.display=v?'none':'block';}
q.addEventListener('input',go);
const modal=document.getElementById('modal'),mimg=document.getElementById('mimg'),
flip=document.getElementById('flip'),bfront=document.getElementById('bfront'),bback=document.getElementById('bback');
function open(c){
mimg.src=c.dataset.img;
document.getElementById('mcat').textContent=c.dataset.cat;
document.getElementById('mname').textContent=c.dataset.name;
document.getElementById('mspec').textContent='Packing: '+c.dataset.spec;
document.getElementById('mcode').textContent='Item code: '+c.dataset.code;
flip.classList.toggle('show',!!c.dataset.back);
bfront.classList.add('on');bback.classList.remove('on');
bfront.onclick=()=>{mimg.src=c.dataset.img;bfront.classList.add('on');bback.classList.remove('on')};
bback.onclick=()=>{if(c.dataset.back){mimg.src=c.dataset.back;bback.classList.add('on');bfront.classList.remove('on')}};
modal.classList.add('open');document.body.style.overflow='hidden';}
function shut(){modal.classList.remove('open');document.body.style.overflow=''}
document.getElementById('close').onclick=shut;
modal.querySelector('.scrim').onclick=shut;
function render(list){
const cats=[...new Set(list.map(p=>p.category))].sort();
pills.innerHTML=['All',...cats].map(c=>`<button class="pill${c==='All'?' on':''}" data-f="${esc(c)}">${esc(c)}</button>`).join('');
pills.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{pills.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));b.classList.add('on');f=b.dataset.f;go()});
grid.innerHTML=list.map(p=>{const img=p.img||`images/${p.code}.webp`;
return `<article class="card" data-cat="${esc(p.category)}" data-search="${esc(searchText(p))}" data-code="${esc(p.code)}" data-name="${esc(p.name)}" data-spec="${esc(p.packing)}" data-img="${esc(img)}"${p.back?` data-back="${esc(p.back)}"`:''}>
      <div class="imgwrap"><img loading="lazy" src="${esc(img)}" alt="${esc(p.name)}"></div>
      <div class="cbody"><div class="ccat">${esc(p.category)}</div><h3>${esc(p.name)}</h3><div class="spec">${esc(p.packing)}</div><div class="code">${esc(p.code)}</div></div>
    </article>`}).join('');
cards=[...grid.querySelectorAll('.card')];cards.forEach(c=>c.onclick=()=>open(c));go();}
fetch('products.json?t='+Date.now()).then(r=>r.json()).then(render)
.catch(()=>{empty.textContent='Could not load products — please refresh.';empty.style.display='block'});
</script></body></html>
