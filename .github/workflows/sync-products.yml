name: Sync products.json
on:
  push:
    branches: [main]
    paths: [index.html]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_products.py
      - run: |
          if git diff --quiet products.json; then exit 0; fi
          git config user.name "products-sync"
          git config user.email "actions@users.noreply.github.com"
          git add products.json
          git commit -m "自动同步 products.json"
          git push
